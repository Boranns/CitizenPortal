name: CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t citizenportal-backend ./CitizenPortal

      - name: Build frontend Docker image
        run: docker build -t citizenportal-frontend ./citizen-portal-frontend

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name citizenportalacr

      - name: Build and push backend image
        run: |
          docker build -t citizenportalacr.azurecr.io/citizenportal-backend:${{ github.sha }} ./CitizenPortal
          docker push citizenportalacr.azurecr.io/citizenportal-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t citizenportalacr.azurecr.io/citizenportal-frontend:${{ github.sha }} ./citizen-portal-frontend
          docker push citizenportalacr.azurecr.io/citizenportal-frontend:${{ github.sha }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: CitizenPortal-RG
          cluster-name: citizenportal-aks

      - name: Deploy to AKS
        run: kubectl apply -f k8s/