version: '3.8'

services:
  backend:
    build:
      context: ./CitizenPortal
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=CitizenPortal
      - Jwt__Audience=CitizenPortalUsers
      - Jwt__ExpireMinutes=60
    depends_on:
      - db

  frontend:
    build:
      context: ./citizen-portal-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/lib/sqlserver/data

volumes:
  sqldata: